<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ordine Ruote · Team Neos Sistemi</title>
<meta name="theme-color" content="#0b2a55">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Modulo nascosto: serve a Netlify per inviare l'email ad amministrazione -->
<form name="ordine-ruote" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="subject"><input name="atleta"><input name="ordine"><input name="totale">
  <textarea name="ruote"></textarea><input name="stagione"><textarea name="note"></textarea><input name="bot-field">
</form>

<header class="top">
  <div class="top-in">
    <img src="logo-bianco.png" alt="Team Neos Sistemi">
    <div>
      <div class="eyebrow">Stagione 2026/2027</div>
      <h1>Ordine ruote</h1>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="loading" class="muted">Caricamento…</div>
  <div id="fatal" class="err" hidden></div>

  <!-- 1. scelta atleta -->
  <section id="v-choose" class="stack" hidden>
    <div>
      <h2>Chi sei?</h2>
      <p class="lead">Tocca il tuo nome per scegliere le ruote.</p>
    </div>
    <div class="athletes" id="athletes"></div>
  </section>

  <!-- riquadro atleta, comune alle schermate successive -->
  <div class="who" id="who" hidden>
    <div><span class="muted small">Atleta</span><br><strong id="who-name"></strong></div>
    <div class="who-links">
      <button class="btn small ghost" id="go-history">I miei ordini <span id="n-ord"></span></button>
      <button class="link" id="change">Non sei tu? Cambia</button>
    </div>
  </div>

  <!-- 2. catalogo -->
  <section id="v-shop" class="stack" hidden>
    <div>
      <h2>Nuovo ordine</h2>
      <p class="lead" id="rule"></p>
    </div>
    <input class="search" id="q" type="search" placeholder="Cerca per nome, misura, durezza…" aria-label="Cerca ruota">
    <div class="filters" id="filters" role="group" aria-label="Filtra per diametro"></div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- 3. carrello -->
  <section id="v-cart" class="stack" hidden>
    <div class="actions"><button class="link" id="back">← Torna alle ruote</button></div>
    <h2>Il tuo carrello</h2>
    <div class="meter" id="meter"></div>
    <div class="cart" id="cart"></div>
    <div id="cart-empty" class="muted" hidden>Il carrello è vuoto. Torna all'elenco e aggiungi le ruote.</div>
    <div id="cart-end" class="stack">
      <label for="note"><h3>Note per l'amministrazione</h3><span class="muted small">Facoltativo: es. urgenza, dubbi sulla durezza…</span></label>
      <textarea id="note" maxlength="1000"></textarea>
      <div id="confirm" class="confirm" hidden>
        <strong>Confermi l'ordine?</strong>
        <span class="small muted" id="confirm-txt"></span>
        <div class="actions">
          <button class="btn pink" id="send">Sì, invia l'ordine</button>
          <button class="btn ghost" id="cancel">Annulla</button>
        </div>
      </div>
      <div id="send-err" class="err" hidden></div>
      <div class="actions"><button class="btn pink" id="ask">Convalida ordine</button></div>
    </div>
  </section>

  <!-- 4. inviato -->
  <section id="v-done" hidden>
    <div class="done">
      <div class="big">Ordine inviato</div>
      <p id="done-txt" style="margin:0"></p>
      <div id="done-mail" class="small muted"></div>
      <div id="done-order" style="width:100%;text-align:left"></div>
      <div class="actions" style="justify-content:center">
        <button class="btn ghost" data-nav="history">Vedi i miei ordini</button>
        <button class="btn" data-nav="shop">Fai un nuovo ordine</button>
      </div>
    </div>
  </section>

  <!-- 5. storico -->
  <section id="v-history" class="stack" hidden>
    <div class="actions"><button class="link" data-nav="shop">← Torna alle ruote</button></div>
    <h2>I miei ordini</h2>
    <div class="meter" id="season"></div>
    <div class="stack" id="history"></div>
  </section>
</main>

<div class="bar" id="bar" hidden>
  <div class="bar-in">
    <div class="sum" id="bar-sum"></div>
    <button class="btn pink" id="go-cart">Vedi carrello</button>
  </div>
</div>

<script src="common.js"></script>
<script>
const N = NEOS, $ = s => document.querySelector(s);
let ATLETI = [], RUOTE = [], me = null, cart = [], filtro = '', diam = '';
let ORD = [], restanti = 0;   // storico dell'atleta e ruote gratis ancora disponibili nella stagione
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

function show(v) {
  for (const id of ['choose', 'shop', 'cart', 'done', 'history']) $('#v-' + id).hidden = id !== v;
  $('#who').hidden = v === 'choose';
  $('#bar').hidden = v !== 'shop';
  if (v === 'shop') { renderGrid(); renderBar(); renderRule(); }
  if (v === 'cart') renderCart();
  if (v === 'history') renderHistory();
  window.scrollTo(0, 0);
}

async function init() {
  try {
    const [a, r] = await Promise.all([N.json('atleti.json'), N.json('ruote.json')]);
    ATLETI = a; RUOTE = r.ruote;
  } catch (e) { $('#fatal').textContent = 'Impossibile caricare i dati: ' + e.message; $('#fatal').hidden = false; return; }
  finally { $('#loading').hidden = true; }
  $('#athletes').innerHTML = ATLETI.map(a => `
    <button class="athlete" data-id="${a.id}">
      <span class="n">${N.esc(a.nome)}</span><span class="c">${N.esc(a.cognome)}</span>
    </button>`).join('');
  const qp = new URLSearchParams(location.search).get('atleta');
  const id = (qp || store.get('atleta') || '').toLowerCase();
  if (ATLETI.some(a => a.id === id)) select(id); else show('choose');
}

function applica(d) {
  ORD = d.ordini || []; restanti = d.gratisRestanti ?? me.gratis;
  $('#n-ord').textContent = ORD.length ? `(${ORD.length})` : '';
}

async function select(id) {
  me = ATLETI.find(a => a.id === id); store.set('atleta', id);
  $('#who-name').textContent = `${me.nome} ${me.cognome}`;
  cart = []; $('#note').value = ''; ORD = []; restanti = me.gratis; $('#n-ord').textContent = '';
  show('shop');
  try { applica(await N.json('/api/ordini?atleta=' + encodeURIComponent(id))); } catch {}
  if (me && me.id === id && !$('#v-shop').hidden) { renderRule(); renderBar(); }
}

function renderRule() {
  $('#rule').innerHTML = restanti > 0
    ? `Hai ancora <b>${restanti} ${restanti === 1 ? 'ruota' : 'ruote'}</b> <span class="chip free">gratis</span> per questa stagione. Le ruote oltre questo numero sono <span class="chip paid">a pagamento</span>`
    : `Hai già usato tutte le ruote gratis della stagione: le ruote di questo ordine sono <span class="chip paid">a pagamento</span>`;
}

const qtyOf = c => (cart.find(r => r.codice === c) || {}).qta || 0;
function setQty(codice, q) {
  q = Math.max(0, Math.min(99, q));
  const i = cart.findIndex(r => r.codice === codice);
  if (q === 0) { if (i >= 0) cart.splice(i, 1); }
  else if (i >= 0) cart[i].qta = q;
  else { const w = RUOTE.find(r => r.codice === codice); cart.push({ codice, nome: w.nome, qta: q }); }
  $('#confirm').hidden = true;
  renderGrid(); renderBar(); if (!$('#v-cart').hidden) renderCart();
}

function stepper(codice, q) {
  return `<div class="stepper" role="group" aria-label="Quantità">
    <button data-step="-1" data-c="${N.esc(codice)}" ${q ? '' : 'disabled'} aria-label="Togli una">−</button>
    <output>${q}</output>
    <button data-step="1" data-c="${N.esc(codice)}" ${q >= 99 ? 'disabled' : ''} aria-label="Aggiungi una">+</button></div>`;
}

function renderFilters() {
  const ds = [...new Set(RUOTE.map(r => (r.dettagli || {}).Diametro).filter(Boolean))].sort();
  $('#filters').hidden = ds.length < 2;
  $('#filters').innerHTML = ['', ...ds].map(d => `<button class="filter" data-diam="${N.esc(d)}" aria-pressed="${d === diam}">${d ? N.esc(d) : 'Tutte'}</button>`).join('');
}
function renderGrid() {
  renderFilters();
  const f = filtro.trim().toLowerCase();
  const list = RUOTE.filter(r => (!diam || (r.dettagli || {}).Diametro === diam) && (!f || [r.nome, r.codice, ...Object.values(r.dettagli || {})].join(' ').toLowerCase().includes(f)));
  $('#grid').innerHTML = list.map(r => {
    const q = qtyOf(r.codice);
    const specs = Object.entries(r.dettagli || {}).filter(([, v]) => v !== '' && v != null)
      .map(([k, v]) => `<li><b>${N.esc(k)}</b> ${N.esc(v)}</li>`).join('');
    return `<article class="wheel ${q ? 'in' : ''}">
      <div><div class="code">${N.esc(r.codice)}</div><h3>${N.esc(r.nome)}</h3></div>
      ${specs ? `<ul class="specs">${specs}</ul>` : ''}
      <div class="row">${q ? '<span class="chip incart">Nel carrello</span>' : '<span class="muted small">Quantità</span>'}${stepper(r.codice, q)}</div>
    </article>`;
  }).join('') || '<p class="muted">Nessuna ruota corrisponde alla ricerca.</p>';
}

function renderBar() {
  const t = N.totali(N.alloca(cart, restanti));
  $('#bar-sum').innerHTML = t.tot
    ? `<strong>${t.tot}</strong> ruote ${t.gratis ? `<span class="chip free">${t.gratis} gratis</span>` : ''}${t.pagamento ? `<span class="chip paid">${t.pagamento} a pagamento</span>` : ''}`
    : `<span>Nessuna ruota scelta</span>`;
  $('#go-cart').disabled = !t.tot;
}

function allocHtml(r) {
  return `<div class="alloc">
    ${r.gratis ? `<div class="free"><span>${r.gratis} ${r.gratis === 1 ? 'ruota' : 'ruote'}</span><b>GRATIS</b></div>` : ''}
    ${r.pagamento ? `<div class="paid"><span>${r.pagamento} ${r.pagamento === 1 ? 'ruota' : 'ruote'}</span><b>A PAGAMENTO</b></div>` : ''}
  </div>`;
}

function renderCart() {
  const righe = N.alloca(cart, restanti), t = N.totali(righe);
  const scala = Math.max(t.tot, restanti, 1);
  $('#meter').innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span>Ruote gratis in questo ordine: <b>${t.gratis}</b>${restanti ? ` (disponibili ${restanti})` : ''}</span>
      <span><b>${t.tot}</b> ruote in totale</span>
    </div>
    <div class="meter-track" aria-hidden="true"><i class="f" style="width:${t.gratis / scala * 100}%"></i><i class="p" style="width:${t.pagamento / scala * 100}%"></i></div>
    <div class="small muted">${t.pagamento ? `<span class="chip paid">${t.pagamento} a pagamento</span> oltre le ruote gratis` : restanti - t.gratis > 0 ? `Puoi scegliere ancora ${restanti - t.gratis} ruote gratis.` : 'Hai usato tutte le ruote gratis.'}</div>`;
  $('#cart').innerHTML = righe.map(r => `
    <div class="line">
      <div class="line-head"><div><div class="code muted small">${N.esc(r.codice)}</div><h3>${N.esc(r.nome)}</h3></div>${stepper(r.codice, r.qta)}</div>
      ${allocHtml(r)}
    </div>`).join('');
  $('#cart-empty').hidden = !!righe.length;
  $('#cart-end').hidden = !righe.length;
  $('#confirm-txt').textContent = `${t.tot} ruote: ${t.gratis} gratis${t.pagamento ? ` e ${t.pagamento} a pagamento` : ''}. Una volta inviato, l'ordine non si può più modificare: per altre ruote potrai fare un nuovo ordine.`;
}

function orderHtml(o) {
  return `<article class="hist">
    <div class="hist-head">
      <div><h3>Ordine n. ${o.numero}</h3><div class="small muted">${N.data(o.inviatoIl)}</div>
        <div style="margin-top:6px">${o.stato === 'ordinato' ? `<span class="chip free">✓ Ordinato${o.evasoIl ? ' il ' + N.data(o.evasoIl).split(',')[0] : ''}</span>` : '<span class="chip paid" style="background:#eef1f6;color:var(--muted)">In attesa</span>'}</div></div>
      <div class="chips"><span class="chip incart">${o.totale} ruote</span>${o.totaleGratis ? `<span class="chip free">${o.totaleGratis} gratis</span>` : ''}${o.totalePagamento ? `<span class="chip paid">${o.totalePagamento} a pag.</span>` : ''}</div>
    </div>
    ${o.righe.map(r => `<div class="hist-row"><span><b>${N.esc(r.nome)}</b> × ${r.qta}</span><span class="chips">${r.gratis ? `<span class="chip free">${r.gratis} gratis</span>` : ''}${r.pagamento ? `<span class="chip paid">${r.pagamento} a pag.</span>` : ''}</span></div>`).join('')}
    ${o.note ? `<div class="small"><b>Note:</b> ${N.esc(o.note)}</div>` : ''}
  </article>`;
}

function renderHistory() {
  const usate = me.gratis - restanti, tot = ORD.reduce((s, o) => s + o.totale, 0);
  $('#season').innerHTML = `
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span>Ruote gratis della stagione usate: <b>${usate} di ${me.gratis}</b></span><span><b>${tot}</b> ruote ordinate</span>
    </div>
    <div class="meter-track" aria-hidden="true"><i class="f" style="width:${usate / me.gratis * 100}%"></i></div>`;
  $('#history').innerHTML = ORD.length
    ? [...ORD].reverse().map(orderHtml).join('')
    : '<p class="muted">Non hai ancora inviato ordini.</p>';
}

// Campi dell'email di Netlify: uno per riga, con simboli colorati per leggere subito gratis / a pagamento.
// Ogni riga termina con due spazi: evita che Outlook unisca le righe.
function campiEmail(o) {
  const rimaste = Math.max(o.gratisStagione - o.gratisUsatePrima - o.totaleGratis, 0);
  const righe = o.righe.map(r => {
    const icona = r.pagamento ? (r.gratis ? '🟩🟧' : '🟧') : '🟩';
    const parti = [r.gratis && `${r.gratis} GRATIS`, r.pagamento && `${r.pagamento} A PAGAMENTO`].filter(Boolean).join(' + ');
    return `${icona}  ${r.qta} × ${r.nome}  →  ${parti}  `;
  });
  const campi = {
    subject: `🛼 Ordine ruote n. ${o.numero} – ${o.nome} (${o.totale} ruote)`,
    atleta: `${o.nome.toUpperCase()}  `,
    ordine: `N. ${o.numero} del ${N.data(o.inviatoIl).replace(',', ' alle')}  `,
    totale: `${o.totale} ruote   ▸   🟩 ${o.totaleGratis} GRATIS   ▸   🟧 ${o.totalePagamento} A PAGAMENTO  `,
    ruote: righe.join('\n\n'),
    stagione: `Ruote gratis della stagione: ${o.gratisStagione}   ·   usate prima di questo ordine: ${o.gratisUsatePrima}   ·   rimaste: ${rimaste}  `,
  };
  if (o.note) campi.note = o.note;
  return campi;
}

async function send() {
  const b = $('#send'); b.disabled = true; b.textContent = 'Invio in corso…'; $('#send-err').hidden = true;
  try {
    const d = await N.json('/api/ordini', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ atleta: me.id, righe: cart, note: $('#note').value })
    });
    const o = d.ordine; applica(d);
    let mailOk = true;
    try {
      const r = await fetch('/', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ 'form-name': 'ordine-ruote', ...campiEmail(o) }).toString()
      });
      mailOk = r.ok;
    } catch { mailOk = false; }
    cart = []; $('#note').value = ''; $('#confirm').hidden = true;
    $('#done-txt').innerHTML = `Grazie <b>${N.esc(me.nome)}</b>! Il tuo ordine n. ${o.numero} di <b>${o.totale} ruote</b> è stato registrato.`;
    $('#done-mail').textContent = mailOk ? "L'amministrazione riceverà il riepilogo via email." : "L'ordine è salvato, ma l'email di avviso non è partita: avvisa tu l'amministrazione.";
    $('#done-order').innerHTML = orderHtml(o);
    show('done');
  } catch (e) {
    $('#send-err').textContent = "L'ordine non è stato inviato: " + e.message + '. Controlla la connessione e riprova.';
    $('#send-err').hidden = false;
  } finally { b.disabled = false; b.textContent = "Sì, invia l'ordine"; }
}

document.addEventListener('click', e => {
  const s = e.target.closest('[data-step]');
  if (s) { setQty(s.dataset.c, qtyOf(s.dataset.c) + Number(s.dataset.step)); return; }
  const fb = e.target.closest('[data-diam]');
  if (fb) { diam = fb.dataset.diam; renderGrid(); return; }
  const nav = e.target.closest('[data-nav]');
  if (nav) { show(nav.dataset.nav); return; }
  const a = e.target.closest('.athlete');
  if (a) select(a.dataset.id);
});
$('#change').onclick = () => { me = null; cart = []; show('choose'); };
$('#go-history').onclick = () => show('history');
$('#q').oninput = e => { filtro = e.target.value; renderGrid(); };
$('#go-cart').onclick = () => show('cart');
$('#back').onclick = () => show('shop');
$('#ask').onclick = () => { $('#confirm').hidden = false; $('#confirm').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
$('#cancel').onclick = () => { $('#confirm').hidden = true; };
$('#send').onclick = send;
init();
</script>
</body>
</html>
