<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ordini Ruote · Amministrazione</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;1,800&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
<style>
  .wrap{padding-bottom:40px}
  .login{max-width:380px;margin:30px auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:12px}
  .login input{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .toolbar .actions{gap:8px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
  .stat b{display:block;font:800 italic 32px/1 var(--f-display);color:var(--navy);font-variant-numeric:tabular-nums}
  .stat.free b{color:var(--free)} .stat.paid b{color:var(--paid)}
  .stat span{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
  .tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
  .tabs button[aria-selected=true]{color:var(--navy);border-color:var(--pink)}
  .order{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
  .order-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start}
  .order-head h3{font-size:24px;font-style:italic;font-weight:800;color:var(--navy)}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  td.n,th.n{text-align:right}
  tfoot td{font-weight:700;border-bottom:0}
  td .chip{font-size:12px}
  .missing{display:grid;gap:8px}
  .miss{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
  .miss code{font-size:12px;color:var(--muted);word-break:break-all}
  .del-confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fde8e6;border-radius:var(--r);padding:10px 12px;color:var(--danger)}
  .print-head{display:none}
  .toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:9}
  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff;font-size:12pt}
    .top,.toolbar,.stats,.tabs,.no-print,.toast,#tab-missing{display:none!important}
    .wrap{padding:0;max-width:none}
    [data-panel]{display:block!important}
    .print-head{display:flex;align-items:center;gap:14px;margin-bottom:10px;border-bottom:2px solid #0b2a55;padding-bottom:8px}
    .print-head img{height:46px}
    .print-head h2{margin:0;font-size:20pt}
    .order{border:0;padding:0;break-inside:avoid}
    .order + .order{break-before:page}
    #tab-totals{break-before:page}
    .chip,.alloc div{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body.p-one .order:not(.printing),body.p-one #tab-totals{display:none!important}
    body.p-one .order.printing{break-before:auto}
    body.p-totals #tab-orders{display:none!important}
    body.p-totals #tab-totals{break-before:auto}
    body.p-orders #tab-totals{display:none!important}
  }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <img src="logo-bianco.png" alt="Team Neos Sistemi">
    <div><div class="eyebrow">Amministrazione</div><h1>Ordini ruote</h1></div>
  </div>
</header>

<main class="wrap stack">
  <form class="login" id="login" hidden>
    <h2>Accesso</h2>
    <label for="pw" class="small muted">Password amministratore</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div id="login-err" class="err" hidden></div>
    <button class="btn">Entra</button>
  </form>

  <div id="app" class="stack" hidden>
    <div class="toolbar">
      <span class="muted small" id="updated"></span>
      <div class="actions">
        <button class="btn small ghost" id="reload">Aggiorna</button>
        <button class="btn small" id="print-all">Stampa tutti gli ordini</button>
        <button class="btn small ghost" id="print-totals">Stampa totale per ruota</button>
        <button class="link" id="logout">Esci</button>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="orders" aria-selected="true">Ordini</button>
      <button role="tab" data-tab="missing" aria-selected="false">Da ordinare</button>
      <button role="tab" data-tab="totals" aria-selected="false">Totale per ruota</button>
    </div>
    <section id="tab-orders" data-panel class="stack"></section>
    <section id="tab-missing" data-panel class="stack" hidden></section>
    <section id="tab-totals" data-panel class="stack" hidden></section>
  </div>
</main>

<script src="common.js"></script>
<script>
const N = NEOS, $ = s => document.querySelector(s);
let PW = '', DATA = { ordini: [], atleti: [] }, delPending = null;
const ss = { get(k) { try { return sessionStorage.getItem(k) || ''; } catch { return ''; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} }, del(k) { try { sessionStorage.removeItem(k); } catch {} } };

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 2200); }

async function load() {
  DATA = await N.json('/api/ordini?tutti=1', { headers: { 'x-admin-password': PW } });
  $('#updated').textContent = 'Aggiornato alle ' + new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
  render();
}

async function login(pw) {
  PW = pw;
  try { await load(); ss.set('pw', pw); $('#login').hidden = true; $('#app').hidden = false; }
  catch (e) { $('#login').hidden = false; $('#app').hidden = true; $('#login-err').textContent = e.message; $('#login-err').hidden = !pw; ss.del('pw'); }
}

const byName = (a, b) => a.nome.split(' ').slice(1).join(' ').localeCompare(b.nome.split(' ').slice(1).join(' '));
const printHead = t => `<div class="print-head"><img src="logo-blu.png" alt=""><div><div class="small muted">Team Neos Sistemi · Stagione 2026/2027</div><h2>${t}</h2></div></div>`;

function orderCard(o) {
  const rows = o.righe.map(r => `<tr><td><b>${N.esc(r.nome)}</b><br><span class="small muted">${N.esc(r.codice)}</span></td>
    <td class="n">${r.qta}</td>
    <td class="n">${r.gratis ? `<span class="chip free">${r.gratis} gratis</span>` : '–'}</td>
    <td class="n">${r.pagamento ? `<span class="chip paid">${r.pagamento} a pag.</span>` : '–'}</td></tr>`).join('');
  return `<article class="order" data-id="${o.atleta}">
    ${printHead('Ordine ruote – ' + N.esc(o.nome))}
    <div class="order-head">
      <div><h3>${N.esc(o.nome)}</h3>
        <div class="small muted">Inviato il ${N.data(o.inviatoIl)}${o.modifiche ? ` · modificato ${o.modifiche} ${o.modifiche === 1 ? 'volta' : 'volte'} (primo invio ${N.data(o.primoInvio)})` : ''} · ${o.gratisPreviste} ruote gratis previste</div></div>
      <div class="actions no-print">
        <button class="btn small" data-print="${o.atleta}">Stampa</button>
        <button class="btn small ghost" data-del="${o.atleta}">Elimina</button>
      </div>
    </div>
    ${delPending === o.atleta ? `<div class="del-confirm no-print">Eliminare l'ordine di ${N.esc(o.nome)}? L'atleta potrà rifarlo.
      <button class="btn small danger" data-del-yes="${o.atleta}">Elimina</button><button class="btn small ghost" data-del-no>Annulla</button></div>` : ''}
    <div class="tbl"><table>
      <thead><tr><th>Ruota</th><th class="n">Q.tà</th><th class="n">Gratis</th><th class="n">A pagamento</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>Totale</td><td class="n">${o.totale}</td><td class="n">${o.totaleGratis}</td><td class="n">${o.totalePagamento}</td></tr></tfoot>
    </table></div>
    ${o.note ? `<div><b>Note:</b> ${N.esc(o.note)}</div>` : ''}
  </article>`;
}

function render() {
  const ordini = [...DATA.ordini].sort(byName), atleti = DATA.atleti;
  const t = ordini.reduce((s, o) => ({ tot: s.tot + o.totale, g: s.g + o.totaleGratis, p: s.p + o.totalePagamento }), { tot: 0, g: 0, p: 0 });
  $('#stats').innerHTML = `
    <div class="stat"><b>${ordini.length}<small style="font-size:18px"> / ${atleti.length}</small></b><span>Ordini ricevuti</span></div>
    <div class="stat"><b>${t.tot}</b><span>Ruote totali</span></div>
    <div class="stat free"><b>${t.g}</b><span>Gratis</span></div>
    <div class="stat paid"><b>${t.p}</b><span>A pagamento</span></div>`;

  $('#tab-orders').innerHTML = ordini.length ? ordini.map(orderCard).join('') : '<p class="muted">Nessun ordine ricevuto finora.</p>';

  const fatti = new Set(ordini.map(o => o.atleta));
  const mancano = atleti.filter(a => !fatti.has(a.id));
  const base = location.origin + location.pathname.replace(/admin\.html$/, '');
  $('#tab-missing').innerHTML = `
    <p class="muted" style="margin:0">Link generale da mandare a tutti: <code>${N.esc(base)}</code> <button class="btn small ghost" data-copy="${N.esc(base)}">Copia</button></p>
    <p class="muted small" style="margin:0">Oppure il link personale di ogni atleta, che apre direttamente il suo ordine:</p>
    <div class="missing">${atleti.map(a => {
      const l = `${base}?atleta=${a.id}`;
      return `<div class="miss"><div><b>${N.esc(a.nome)} ${N.esc(a.cognome)}</b> ${fatti.has(a.id) ? '<span class="chip free">ordinato</span>' : '<span class="chip paid">da ordinare</span>'}<br><code>${N.esc(l)}</code></div>
        <button class="btn small ghost" data-copy="${N.esc(l)}">Copia link</button></div>`;
    }).join('')}</div>
    ${mancano.length ? '' : '<p><span class="chip free">Tutti gli atleti hanno ordinato</span></p>'}`;

  const per = {};
  for (const o of ordini) for (const r of o.righe) {
    const k = r.codice; per[k] ??= { codice: k, nome: r.nome, tot: 0, g: 0, p: 0, chi: [] };
    per[k].tot += r.qta; per[k].g += r.gratis; per[k].p += r.pagamento; per[k].chi.push(`${o.nome.split(' ')[0]} ${o.nome.split(' ').slice(1).join(' ')} (${r.qta})`);
  }
  const rows = Object.values(per).sort((a, b) => a.nome.localeCompare(b.nome));
  $('#tab-totals').innerHTML = printHead('Totale ruote da ordinare') + (rows.length ? `<div class="tbl" style="background:#fff;border:1px solid var(--line);border-radius:var(--r)"><table>
    <thead><tr><th>Ruota</th><th>Atleti</th><th class="n">Gratis</th><th class="n">A pagamento</th><th class="n">Totale</th></tr></thead>
    <tbody>${rows.map(r => `<tr><td><b>${N.esc(r.nome)}</b><br><span class="small muted">${N.esc(r.codice)}</span></td><td class="small">${N.esc(r.chi.join(', '))}</td>
      <td class="n">${r.g}</td><td class="n">${r.p}</td><td class="n"><b>${r.tot}</b></td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="2">Totale</td><td class="n">${t.g}</td><td class="n">${t.p}</td><td class="n">${t.tot}</td></tr></tfoot></table></div>` : '<p class="muted">Nessun ordine ricevuto finora.</p>');
}

function doPrint(mode, id) {
  document.body.classList.remove('p-one', 'p-totals', 'p-orders');
  document.querySelectorAll('.order.printing').forEach(e => e.classList.remove('printing'));
  document.body.classList.add('p-' + mode);
  if (id) document.querySelector(`.order[data-id="${id}"]`)?.classList.add('printing');
  setTimeout(() => window.print(), 50);
}
window.addEventListener('afterprint', () => document.body.classList.remove('p-one', 'p-totals', 'p-orders'));

document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab) {
    document.querySelectorAll('[role=tab]').forEach(b => b.setAttribute('aria-selected', b === t));
    document.querySelectorAll('[data-panel]').forEach(p => p.hidden = p.id !== 'tab-' + t.dataset.tab);
  }
  if (t.dataset.print) doPrint('one', t.dataset.print);
  if (t.dataset.del) { delPending = t.dataset.del; render(); }
  if ('delNo' in t.dataset) { delPending = null; render(); }
  if (t.dataset.delYes) {
    try { await N.json('/api/ordini?atleta=' + t.dataset.delYes, { method: 'DELETE', headers: { 'x-admin-password': PW } }); delPending = null; await load(); toast('Ordine eliminato'); }
    catch (err) { toast(err.message); }
  }
  if (t.dataset.copy) {
    try { await navigator.clipboard.writeText(t.dataset.copy); toast('Link copiato'); } catch { toast('Copia non riuscita: seleziona il link a mano'); }
  }
});
$('#print-all').onclick = () => doPrint('orders');
$('#print-totals').onclick = () => doPrint('totals');
$('#reload').onclick = () => load().then(() => toast('Aggiornato')).catch(e => toast(e.message));
$('#logout').onclick = () => { ss.del('pw'); location.reload(); };
$('#login').onsubmit = e => { e.preventDefault(); login($('#pw').value); };
const saved = ss.get('pw');
if (saved) login(saved); else $('#login').hidden = false;
</script>
</body>
</html>
